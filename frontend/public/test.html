<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script type="module" src="https://unpkg.com/@google/model-viewer@latest"></script>
        <title>GLB Viewer</title>
    </head>
    <body>
        <model-viewer
            src="./images/40hq.gltf"
            alt="40'HQ"
            loading="lazy"
            auto-rotate
            disable-zoom
            reveal="auto"
            style="width: 100%; height: 500px"
        >
        </model-viewer>
        <model-viewer src="./images/40fr.gltf" alt="40'FR" loading="lazy" camera-controls style="width: 100%; height: 500px">
        </model-viewer>
        <model-viewer src="./images/20dr.gltf" alt="20'DR" loading="lazy" camera-controls ar style="width: 100%; height: 500px">
        </model-viewer>
        <model-viewer src="./images/20fr.gltf" alt="20'FR" loading="lazy" camera-controls ar style="width: 100%; height: 500px">
        </model-viewer>
    </body>
</html>
